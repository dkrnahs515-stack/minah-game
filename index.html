<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>픽셀 월드 온라인 RPG</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="game" aria-label="2D 픽셀 온라인 RPG 게임 화면"></canvas>

  <div class="hud" aria-live="polite">
    <section class="player-panel glass">
      <div class="player-header">
        <div>
          <strong>무명의 모험가</strong>
          <small>LV. 1 · 중앙 초원</small>
        </div>
        <span id="networkBadge" class="status offline">오프라인</span>
      </div>
      <div class="stat-row"><span>HP</span><b id="hpText">100 / 100</b></div>
      <div class="bar hp"><i id="hpBar"></i></div>
      <div class="stat-row"><span>MP</span><b id="mpText">100 / 100</b></div>
      <div class="bar mp"><i id="mpBar"></i></div>
    </section>

    <section class="performance-panel glass">
      <span><b id="fpsText">0</b> FPS</span>
      <span><b id="playerCount">1</b>명 접속</span>
      <span id="qualityText">고화질</span>
    </section>

    <div id="message" class="message">대륙을 탐험해 보세요.</div>

    <section class="minimap glass" aria-label="미니맵">
      <canvas id="minimap" width="220" height="140"></canvas>
      <div class="minimap-label">세계 지도</div>
    </section>

    <section class="controls glass">
      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>이동</span></div>
      <div><kbd>Q</kbd><kbd>E</kbd><kbd>R</kbd><span>스킬</span></div>
      <div><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><span>아이템</span></div>
    </section>

    <section class="hotbar" aria-label="단축키 슬롯">
      <div class="slot-group glass">
        <button class="slot" data-code="KeyQ" type="button"><span class="key">Q</span><span class="slot-type">SKILL</span><span class="empty">비어 있음</span></button>
        <button class="slot" data-code="KeyE" type="button"><span class="key">E</span><span class="slot-type">SKILL</span><span class="empty">비어 있음</span></button>
        <button class="slot" data-code="KeyR" type="button"><span class="key">R</span><span class="slot-type">SKILL</span><span class="empty">비어 있음</span></button>
      </div>
      <div class="slot-group glass">
        <button class="slot item" data-code="Digit1" type="button"><span class="key">1</span><span class="slot-type">ITEM</span><span class="empty">비어 있음</span></button>
        <button class="slot item" data-code="Digit2" type="button"><span class="key">2</span><span class="slot-type">ITEM</span><span class="empty">비어 있음</span></button>
        <button class="slot item" data-code="Digit3" type="button"><span class="key">3</span><span class="slot-type">ITEM</span><span class="empty">비어 있음</span></button>
      </div>
    </section>
  </div>

  <noscript>이 게임은 JavaScript가 필요합니다.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
