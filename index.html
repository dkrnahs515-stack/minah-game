<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>낙화참 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#bfe3ff}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}.panel{position:absolute;top:16px;left:16px;width:300px;padding:14px;border-radius:16px;background:#0f172bb8}.bar{height:12px;margin:6px 0 10px;border-radius:10px;background:#ffffff44;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#38bdf8}.bar.enemy i{background:#fb7185}.skill{position:absolute;right:18px;bottom:18px;padding:14px 18px;border-radius:16px;background:#701a75cc;text-align:center}.msg{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 18px;border-radius:99px;background:#0f172bcc}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#9dd8ffcc,#ffd2e8dd);z-index:10}.card{padding:28px;border-radius:24px;background:#fffffff0;color:#1f2937;text-align:center;max-width:520px}.card h1{color:#a21caf}.card button{border:0;border-radius:99px;padding:13px 26px;background:#a21caf;color:#fff;font-weight:700;font-size:17px;cursor:pointer}</style></head><body><div id="game"></div><div class="hud"><div class="panel"><b>낙화참 3D</b><div>마나 <span id="manaText">100 / 100</span></div><div class="bar"><i id="mana"></i></div><div>적 HP <span id="hpText">500 / 500</span></div><div class="bar enemy"><i id="hp"></i></div></div><div class="skill"><b>Z · 낙화참</b><div id="cd">사용 가능</div><small>작은 참격들을 빠르게 날려보냅니다.<br>한 틱당 데미지의 40%</small></div><div class="msg" id="msg">적에게 가까이 가서 Z키를 누르세요.</div></div><div class="overlay" id="overlay"><div class="card"><h1>낙화참 3D</h1><p>WASD 이동 · 마우스 시점 · Z 낙화참 · R 적 재생성</p><button id="start">게임 시작</button></div></div><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';const C={atk:25,rate:.4,ticks:16,gap:62,cd:5000,range:13,cost:35,mana:100,regen:9,speed:6.3,hp:500};const root=document.querySelector('#game'),ov=document.querySelector('#overlay'),msg=document.querySelector('#msg'),manaEl=document.querySelector('#mana'),manaText=document.querySelector('#manaText'),hpEl=document.querySelector('#hp'),hpText=document.querySelector('#hpText'),cdEl=document.querySelector('#cd');const scene=new T.Scene();scene.background=new T.Color(0xbfe3ff);scene.fog=new T.Fog(0xbfe3ff,30,80);const cam=new T.PerspectiveCamera(58,innerWidth/innerHeight,.1,120),ren=new T.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;root.appendChild(ren.domElement);scene.add(new T.HemisphereLight(0xffffff,0x70876f,2.2));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(-12,25,-8);sun.castShadow=true;scene.add(sun);const ground=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0x8fc97f,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const path=new T.Mesh(new T.PlaneGeometry(12,70),new T.MeshStandardMaterial({color:0xdac7a6}));path.rotation.x=-Math.PI/2;path.position.y=.01;scene.add(path);for(let i=0;i<24;i++){const trunk=new T.Mesh(new T.CylinderGeometry(.28,.42,3,8),new T.MeshStandardMaterial({color:0x76513d})),leaf=new T.Mesh(new T.IcosahedronGeometry(1.25,1),new T.MeshStandardMaterial({color:i%5?0x5d9c61:0xf3a8c6})),g=new T.Group();trunk.position.y=1.5;leaf.position.y=3.4;trunk.castShadow=leaf.castShadow=true;g.add(trunk,leaf);g.position.set((i%2?-1:1)*(14+Math.random()*25),0,-30+Math.random()*60);scene.add(g)}function player(){const g=new T.Group(),white=new T.MeshStandardMaterial({color:0xf8f4ee}),dark=new T.MeshStandardMaterial({color:0x28364c}),skin=new T.MeshStandardMaterial({color:0xffd4b2}),hair=new T.MeshStandardMaterial({color:0x4b362d});const body=new T.Mesh(new T.CapsuleGeometry(.62,1,7,14),white);body.position.y=1.55;const pants=new T.Mesh(new T.ConeGeometry(.82,1.2,8),dark);pants.position.y=.72;const head=new T.Mesh(new T.SphereGeometry(.47,20,16),skin);head.position.y=2.55;const h=new T.Mesh(new T.SphereGeometry(.51,16,12,0,Math.PI*2,0,Math.PI*.58),hair);h.position.y=2.69;const sword=new T.Mesh(new T.BoxGeometry(.08,.05,2.4),new T.MeshStandardMaterial({color:0xf0fbff,metalness:.8}));sword.position.set(.82,1.35,-1);sword.rotation.x=.25;[body,pants,head,h,sword].forEach(x=>{x.castShadow=true;g.add(x)});g.userData.sword=sword;return g}function monster(){const g=new T.Group(),m=new T.MeshStandardMaterial({color:0x536173});const b=new T.Mesh(new T.CapsuleGeometry(1.05,1.55,8,18),m);b.position.y=1.55;const h=new T.Mesh(new T.SphereGeometry(.92,20,15),m);h.position.y=3.25;const eyeM=new T.MeshBasicMaterial({color:0xff4567});[-.34,.34].forEach(x=>{const e=new T.Mesh(new T.SphereGeometry(.09,10,8),eyeM);e.position.set(x,3.35,.83);g.add(e)});b.castShadow=h.castShadow=true;g.add(b,h);g.userData.mat=m;return g}const p=player(),e=monster();p.position.set(0,0,11);e.position.set(0,0,-7);scene.add(p,e);const keys=new Set(),slashes=[],parts=[],clock=new T.Clock();let started=false,yaw=Math.PI,pitch=.34,mana=C.mana,hp=C.hp,last=-1e9,casting=false;function say(s){msg.textContent=s}function reset(){hp=C.hp;e.visible=true;e.position.set((Math.random()-.5)*10,0,-8-Math.random()*8);say('적이 다시 나타났습니다.')}function face(){const d=e.position.clone().sub(p.position);p.rotation.y=Math.atan2(d.x,d.z)}function cast(){if(!started)return;const now=performance.now(),dist=p.position.distanceTo(e.position);if(!e.visible)return say('R키로 적을 재생성하세요.');if(now-last<C.cd)return say('아직 쿨타임입니다.');if(mana<C.cost)return say('마나가 부족합니다.');if(dist>C.range)return say('적이 너무 멉니다.');mana-=C.cost;last=now;casting=true;face();say('낙화참!');for(let i=0;i<C.ticks;i++)setTimeout(()=>{if(e.visible)slash();if(i===C.ticks-1)casting=false},i*C.gap)}function slash(){const g=new T.Group(),a=new T.Mesh(new T.PlaneGeometry(1.7,.2),new T.MeshBasicMaterial({color:0xffdcfa,transparent:true,side:T.DoubleSide,blending:T.AdditiveBlending})),b=new T.Mesh(new T.PlaneGeometry(2.1,.45),new T.MeshBasicMaterial({color:0xd946ef,transparent:true,opacity:.3,side:T.DoubleSide,blending:T.AdditiveBlending}));g.add(a,b);const s=p.position.clone().add(new T.Vector3((Math.random()-.5)*1.2,1.2+Math.random()*1.6,(Math.random()-.5)*1.2)),t=e.position.clone().add(new T.Vector3((Math.random()-.5)*1.3,1+Math.random()*2.4,(Math.random()-.5)*1.3));g.position.copy(s);g.lookAt(t);g.rotateZ((Math.random()-.5)*1.5);scene.add(g);slashes.push({g,s,t,time:0,d:.13+Math.random()*.08,hit:false})}function damage(pos){hp=Math.max(0,hp-C.atk*C.rate);e.userData.mat.emissive.setHex(0xffffff);e.userData.mat.emissiveIntensity=1.3;setTimeout(()=>{e.userData.mat.emissive.setHex(0);e.userData.mat.emissiveIntensity=0},70);for(let i=0;i<7;i++){const q=new T.Mesh(new T.SphereGeometry(.06,6,5),new T.MeshBasicMaterial({color:i%2?0xffffff:0xff82d8,transparent:true}));q.position.copy(pos);scene.add(q);parts.push({q,v:new T.Vector3(Math.random()-.5,Math.random(),Math.random()-.5).normalize().multiplyScalar(3+Math.random()*3),life:.5})}if(hp<=0){say('적 처치! R키로 다시 생성하세요.');setTimeout(()=>e.visible=false,220)}}function updatePlayer(dt){if(!started||casting)return;let x=0,z=0;if(keys.has('KeyW'))z--;if(keys.has('KeyS'))z++;if(keys.has('KeyA'))x--;if(keys.has('KeyD'))x++;const v=new T.Vector3(x,0,z);if(!v.lengthSq())return;v.normalize();const f=new T.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new T.Vector3(f.z,0,-f.x),m=f.multiplyScalar(-v.z).add(r.multiplyScalar(v.x)).normalize(),sp=C.speed*(keys.has('ShiftLeft')?1.55:1);p.position.addScaledVector(m,sp*dt);p.rotation.y=Math.atan2(m.x,m.z)}function updateCam(dt){const f=p.position.clone().add(new T.Vector3(0,1.75,0)),d=7.7,des=new T.Vector3(f.x+Math.sin(yaw)*d*Math.cos(pitch),f.y+1.4+Math.sin(pitch)*d,f.z+Math.cos(yaw)*d*Math.cos(pitch));cam.position.lerp(des,1-Math.pow(.001,dt));cam.lookAt(f)}function loop(){const dt=Math.min(clock.getDelta(),.05),now=performance.now();if(started)mana=Math.min(C.mana,mana+C.regen*dt);updatePlayer(dt);updateCam(dt);for(let i=slashes.length-1;i>=0;i--){const s=slashes[i];s.time+=dt;const k=Math.min(1,s.time/s.d),q=1-Math.pow(1-k,3);s.g.position.lerpVectors(s.s,s.t,q);s.g.scale.setScalar(.7+Math.sin(k*Math.PI)*.7);s.g.children.forEach((c,j)=>c.material.opacity=(1-k)*(j?.95:.3));if(k>=1&&!s.hit){s.hit=true;damage(s.t)}if(k>=1){scene.remove(s.g);slashes.splice(i,1)}}for(let i=parts.length-1;i>=0;i--){const a=parts[i];a.life-=dt;a.q.position.addScaledVector(a.v,dt);a.v.y-=3*dt;a.q.material.opacity=Math.max(0,a.life/.5);if(a.life<=0){scene.remove(a.q);parts.splice(i,1)}}manaEl.style.width=mana+'%';manaText.textContent=`${Math.floor(mana)} / 100`;hpEl.style.width=hp/C.hp*100+'%';hpText.textContent=`${hp} / ${C.hp}`;const rem=Math.max(0,C.cd-(now-last));cdEl.textContent=rem?`${(rem/1000).toFixed(1)}초`:mana<C.cost?'마나 부족':'사용 가능';ren.render(scene,cam);requestAnimationFrame(loop)}document.querySelector('#start').onclick=()=>{started=true;ov.style.display='none';ren.domElement.requestPointerLock?.()};ren.domElement.onclick=()=>started&&ren.domElement.requestPointerLock?.();document.addEventListener('mousemove',a=>{if(document.pointerLockElement!==ren.domElement)return;yaw-=a.movementX*.0024;pitch=T.MathUtils.clamp(pitch-a.movementY*.0018,-.12,.88)});document.addEventListener('keydown',a=>{keys.add(a.code);if(a.code==='KeyZ'&&!a.repeat)cast();if(a.code==='KeyR'&&!a.repeat)reset()});document.addEventListener('keyup',a=>keys.delete(a.code));addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});updateCam(1);loop();</script></body></html>
